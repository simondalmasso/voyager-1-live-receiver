name: ORDER011 R3 Terminal Deploy
on:
  push:
    branches: [feat/order-011-deep-space-lab]
    paths: ['ops/order011-r3-deploy-request.json']
permissions:
  contents: write
  actions: read
  checks: read
  deployments: write
env:
  AUD_COMMENT_ID: '5220223426'
  R2_PRODUCTION_SHA: 035565aff485d5911d53fc24cf960a8b65a8d146
  R2_CLOUDFLARE_VERSION: 938280db-e9f7-42c1-a7a3-bcc0c18eca41
  PRODUCTION_URL: https://voyager-1-live-receiver.simondalmasso44.workers.dev
  PUBLIC_REPO_DESCRIPTION: Verified receive-only deep-space signal laboratory for Voyager 1 mission geometry, receiver DSP, provenance, and evidence truth.
  USD_BUDGET: '0'
  PAYMENT_DATA: 'NO'
  RF_TX: 'NO'
  MAIN_MERGE: 'NO'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: R3 authority and immutable safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$AUD_COMMENT_ID" = '5220223426'
          test "$R2_PRODUCTION_SHA" = '035565aff485d5911d53fc24cf960a8b65a8d146'
          test "$R2_CLOUDFLARE_VERSION" = '938280db-e9f7-42c1-a7a3-bcc0c18eca41'
          test "$USD_BUDGET" = '0' && test "$PAYMENT_DATA" = 'NO' && test "$RF_TX" = 'NO' && test "$MAIN_MERGE" = 'NO'
          test -n "${CLOUDFLARE_API_TOKEN:-}" && test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          jq -e '.action == "EXECUTE_ORDER_011_R3_EVIDENCE_TRUTH_PATCH" and .audCommentId == 5220223426 and .baselineProductionSha == "035565aff485d5911d53fc24cf960a8b65a8d146" and .rollbackVersion == "938280db-e9f7-42c1-a7a3-bcc0c18eca41" and .preserveFullscreen == true and .preserveR2Science == true and .usdBudget == 0 and .paymentData == "NO" and .rfTx == "NO" and .mainMerge == "NO"' ops/order011-r3-deploy-request.json >/dev/null
          git merge-base --is-ancestor "$R2_PRODUCTION_SHA" "$GITHUB_SHA"
          echo 'ORDER_011_R3_AUTHORITY=PASS'
      - name: Verify Cloudflare identity and accepted R2 production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/order011-r3/predeploy
          npx --yes wrangler@4.114.0 whoami > artifacts/order011-r3/predeploy/whoami.txt
          npx --yes wrangler@4.114.0 deployments list --json > artifacts/order011-r3/predeploy/cloudflare-deployments.json
          printf '%s\n' "$R2_CLOUDFLARE_VERSION" > artifacts/order011-r3/predeploy/rollback-version-id.txt
          streak=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v1/health?r3pre=$i-$RANDOM" -o artifacts/order011-r3/predeploy/health.json && jq -e --arg baseline "$R2_PRODUCTION_SHA" '.status=="ok" and .buildSha==$baseline' artifacts/order011-r3/predeploy/health.json >/dev/null; then streak=$((streak+1)); else streak=0; fi
            if test "$streak" -ge 3; then break; fi
            sleep 2
          done
          test "$streak" -ge 3
          echo 'R2_PRODUCTION_BASELINE_STABLE=PASS'
      - name: Install exact dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -e ./listener-agent
      - name: R3 evidence truth and backpressure tests plus full regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/order011-r3
          node --test tests/order011-r3.test.mjs | tee artifacts/order011-r3/evidence-truth-tests.log
          python -m unittest discover -s listener-agent/tests -p 'test_order011_r3.py' -v 2>&1 | tee artifacts/order011-r3/backpressure-test.log
          npm test
          npm run lint
          npm run format:check
          npm run verify:data
          npm run inventory
          npm run build
          npm run bundle:report
          python -m unittest discover -s listener-agent/tests -v
          voyager-listener doctor | tee artifacts/order011-r3/listener-doctor.json
          voyager-science verify-geometry | tee artifacts/order011-r3/geometry-check.json
          python scripts/order011-r2-horizons-check.py | tee artifacts/order011-r3/horizons-observer-crosscheck.log
          voyager-science evidence-fixture --output artifacts/order011-r3/evidence.zip --verify | tee artifacts/order011-r3/evidence-verify.json
          test -s dist/assets/voyager-probe-a.glb
          echo '7cf8eefb5a0fca9e4e1b0d1e51c37433124169183e5dbfd2d8034af902311821  dist/assets/voyager-probe-a.glb' | sha256sum -c -
          echo 'ORDER011_R3_EVIDENCE_AND_BACKPRESSURE=PASS'
      - name: Fullscreen and browser evidence-download regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false @playwright/test@1.62.0 @axe-core/playwright@4.12.1
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
          echo 'ORDER011_R3_FULLSCREEN_PRESERVED=PASS'
      - name: Reconcile documentation and public repository truth
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/order011-r3/truth
          grep -q 'Voyager Link is deployed in production' docs/DEPLOYMENT.md
          grep -q 'READY_CANONICAL_MANIFEST' docs/PRODUCT_TRUTH.md
          grep -q 'browser does not synthesize' docs/EVIDENCE_BUNDLES.md
          repo="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          printf '%s\n' "$repo" > artifacts/order011-r3/truth/repository-before.json
          current="$(printf '%s' "$repo" | jq -r '.description // ""')"
          if test "$current" != "$PUBLIC_REPO_DESCRIPTION"; then
            code="$(curl --silent --show-error -o artifacts/order011-r3/truth/repository-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'content-type: application/json' --data "$(jq -nc --arg description "$PUBLIC_REPO_DESCRIPTION" '{description:$description}')" "https://api.github.com/repos/$GITHUB_REPOSITORY")"
            test "$code" = 200
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY" > artifacts/order011-r3/truth/repository-after.json
          jq -e --arg description "$PUBLIC_REPO_DESCRIPTION" '.description==$description' artifacts/order011-r3/truth/repository-after.json >/dev/null
          echo 'ORDER011_R3_PUBLIC_TRUTH=PASS'
      - name: Retain Wrangler dry-run artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/order011-r3/wrangler-dry-run
          npx --yes wrangler@4.114.0 deploy --dry-run --outdir artifacts/order011-r3/wrangler-dry-run | tee artifacts/order011-r3/wrangler-dry-run.log
          find artifacts/order011-r3/wrangler-dry-run -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/order011-r3/wrangler-dry-run.sha256
          test -s artifacts/order011-r3/wrangler-dry-run.sha256
          echo 'WRANGLER_DRYRUN_ARTIFACT=PASS'
      - name: Require exact-SHA CodeQL with zero annotations
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            checks="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100")"
            count="$(printf '%s' "$checks" | jq '[.check_runs[]|select(.name=="CodeQL")]|length')"
            pending="$(printf '%s' "$checks" | jq '[.check_runs[]|select(.name=="CodeQL" and .status!="completed")]|length')"
            bad="$(printf '%s' "$checks" | jq '[.check_runs[]|select(.name=="CodeQL" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length')"
            annotations="$(printf '%s' "$checks" | jq '[.check_runs[]|select(.name=="CodeQL")|.output.annotations_count // 0]|add // 0')"
            echo "CODEQL count=$count pending=$pending bad=$bad annotations=$annotations"
            test "$bad" = 0 || exit 33
            if test "$count" -gt 0 && test "$pending" = 0 && test "$annotations" = 0; then exit 0; fi
            sleep 5
          done
          exit 34
      - name: Deploy exact R3 audited SHA
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 deploy --var "BUILD_SHA:$GITHUB_SHA" 2>&1 | tee artifacts/order011-r3/cloudflare-deploy.txt
          version="$(grep -Eio 'Version ID:?[[:space:]]*[0-9a-f-]{20,}' artifacts/order011-r3/cloudflare-deploy.txt | tail -1 | grep -Eo '[0-9a-f-]{20,}' || true)"
          echo "version_id=$version" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_SHA=$GITHUB_SHA"
          echo "CLOUDFLARE_VERSION_ID=${version:-UNPARSED}"
      - name: R3 production evidence truth and accepted R2 science verification
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/order011-r3/production
          streak=0
          for i in $(seq 1 90); do
            probe="$i-$RANDOM"; health_ok=0; caps_ok=0
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v1/health?r3=$probe" -o artifacts/order011-r3/production/health.json && jq -e --arg sha "$GITHUB_SHA" '.status=="ok" and .buildSha==$sha and .costProfile=="USD_0_FREE_PLAN"' artifacts/order011-r3/production/health.json >/dev/null; then health_ok=1; fi
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v2/lab/capabilities?r3=$probe" -o artifacts/order011-r3/production/capabilities.json && jq -e '.schemaVersion==2 and .canonicalIQBus.rawIqToCloud==false and .spectrometer.statefulBounds==true and .evidence.browserGeneratesParallelFormat==false and .evidence.readiness=="FAIL_CLOSED_LISTENER_STATUS_MANIFEST_AND_MISSING" and .receiveOnly==true and .costProfile=="USD_0"' artifacts/order011-r3/production/capabilities.json >/dev/null; then caps_ok=1; fi
            if test "$health_ok" = 1 && test "$caps_ok" = 1; then streak=$((streak+1)); else streak=0; fi
            echo "R3_EDGE_CONVERGENCE attempt=$i health=$health_ok capabilities=$caps_ok streak=$streak"
            if test "$streak" -ge 3; then break; fi
            sleep 2
          done
          test "$streak" -ge 3
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v2/lab/evidence?probe=$RANDOM" -o artifacts/order011-r3/production/evidence-not-ready.json
          jq -e '.status=="NOT_READY" and .partialManifestAvailable==false and (.missing|index("listenerEvidenceManifest"))!=null and (.manifest|not)' artifacts/order011-r3/production/evidence-not-ready.json >/dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v2/lab/pipeline?probe=$RANDOM" -o artifacts/order011-r3/production/pipeline.json
          jq -e '.schemaVersion==2 and .rawIqCloud==false and .receiveOnly==true and ([.stages[]|select(.id=="EVIDENCE" and .status=="NOT_READY" and (.missing|index("listenerEvidenceManifest"))!=null)]|length)==1' artifacts/order011-r3/production/pipeline.json >/dev/null
          node --input-type=module <<'NODE' > artifacts/order011-r3/production/evidence-ready-contract.json
          import {canonicalEvidenceStatus,pipelineTelemetry} from './worker/lab.js';
          const manifest={schemaVersion:1,observationId:'terminal-ready-contract',files:{}};
          const snapshot={sourceMode:'RECORDED_AUTHENTIC_VERIFIED',analysis:{state:'INSUFFICIENT_EVIDENCE',confidence:0},provenance:{truthClass:'RECORDED_AUTHENTIC_VERIFIED'},evidence:{status:'READY_CANONICAL_MANIFEST',missing:[],manifest,manifestSha256:'terminal'}};
          const evidence=canonicalEvidenceStatus(snapshot),pipeline=pipelineTelemetry(snapshot),stage=pipeline.stages.find(x=>x.id==='EVIDENCE');
          if(evidence.status!=='READY'||stage.status!=='READY_CANONICAL_MANIFEST'||evidence.manifest!==manifest)throw new Error('READY contract failed');
          console.log(JSON.stringify({evidence,pipelineEvidence:stage,exactSha:process.env.GITHUB_SHA},null,2));
          NODE
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PRODUCTION_URL/api/v2/observation-window?lat=-31.4&lon=-64.2&elevation=500&minElevationDeg=-90&durationMinutes=30&stepMinutes=15&probe=$RANDOM" -o artifacts/order011-r3/production/window.json
          jq -e '.schemaVersion==2 and .predictionFreshness=="HORIZONS_OBSERVER_FRESH" and .rfPredictionReady==true and ([.predictions[]|select(.rangeRateSource=="JPL_HORIZONS_OBSERVER" and (.expectedCarrierHz|type)=="number")]|length)==3' artifacts/order011-r3/production/window.json >/dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' -D artifacts/order011-r3/production/headers.txt "$PRODUCTION_URL/?probe=$RANDOM" -o artifacts/order011-r3/production/index.html
          grep -q 'VOYAGER LINK' artifacts/order011-r3/production/index.html
          grep -q 'micro-hud' artifacts/order011-r3/production/index.html
          grep -qi '^x-content-type-options: nosniff' artifacts/order011-r3/production/headers.txt
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PRODUCTION_URL/assets/voyager-probe-a.glb?probe=$RANDOM" -o artifacts/order011-r3/production/model.glb
          echo '7cf8eefb5a0fca9e4e1b0d1e51c37433124169183e5dbfd2d8034af902311821  artifacts/order011-r3/production/model.glb' | sha256sum -c -
          echo 'ORDER011_R3_PRODUCTION_EVIDENCE_TRUTH=PASS'
      - name: R3 production fullscreen regression matrix
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_URL="$PRODUCTION_URL" node --input-type=module <<'NODE'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch({headless:true});
          const sizes=[[360,800],[390,844],[412,915],[844,390],[1280,720],[1440,900]];
          for(const [width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height}});let ready=false;
            for(let attempt=0;attempt<15;attempt++){
              await page.goto(`${process.env.PRODUCTION_URL}/?order011r3=${Date.now()}-${attempt}`,{waitUntil:'networkidle'});
              if(await page.locator('#hud-lab').count()){ready=true;break}
              await page.waitForTimeout(2000);
            }
            if(!ready)throw new Error(`R3 shell not converged ${width}x${height}`);
            await page.waitForFunction(()=>{const el=document.querySelector('#freshness');return el&&!/Loading source state/i.test(el.textContent||'')},{timeout:30000});
            if((await page.locator('#primary-controls').isVisible())||(await page.locator('#lab-drawer').isVisible())||(await page.locator('#signal-panel').isVisible()))throw new Error(`initial disclosure open ${width}x${height}`);
            const ratio=await page.evaluate(()=>{const n=[...document.querySelectorAll('.micro-brand,.micro-truth,.micro-controls button')].filter(x=>getComputedStyle(x).display!=='none');return n.reduce((s,x)=>{const r=x.getBoundingClientRect();return s+r.width*r.height},0)/(innerWidth*innerHeight)});if(!(ratio<.1))throw new Error(`persistent UI ratio ${ratio}`);
            const canvas=page.locator('#space-canvas');if(await canvas.isVisible()){await page.waitForFunction(()=>document.querySelector('#space-canvas')?.dataset.fitValid==='true',{timeout:15000})}else if(!(await page.locator('#webgl-fallback').isVisible()))throw new Error('no scene or fallback');
            await page.locator('#hud-lab').click();if(!(await page.locator('#lab-drawer').isVisible()))throw new Error('lab disclosure failed');await page.locator('#lab-close').click();
            await page.screenshot({path:`artifacts/order011-r3/production/${width}x${height}.png`});await page.close();
          }
          await browser.close();console.log('ORDER011_R3_FULLSCREEN_REGRESSION=PASS');
          NODE
      - name: Write R3 terminal evidence manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/order011-r3 -type f ! -name 'terminal-files.sha256' -print0 | sort -z | xargs -0 sha256sum > artifacts/order011-r3/terminal-files.sha256
          jq -n --arg sha "$GITHUB_SHA" --arg version '${{ steps.cloudflare.outputs.version_id }}' --arg url "$PRODUCTION_URL" '{status:"DEPLOYED_READY_FOR_AUD_011_R3",headSha:$sha,productionVersion:$version,productionUrl:$url,evidenceFailClosed:"PASS",backpressureTruth:"PASS",fullscreenPreserved:"PASS",r2SciencePreserved:"PASS",costIncurredUsd:0,paymentDataUsed:"NO",rfUplink:"NOT_IMPLEMENTED",mainMerge:"NO",auditHandoff:"READY"}' > artifacts/order011-r3/checkpoint.json
      - name: Roll back automatically on R3 material regression
        if: failure() && steps.cloudflare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 rollback "$R2_CLOUDFLARE_VERSION" --message "ORDER011 R3 automatic rollback after failed production verification"
          echo "ROLLBACK_EXECUTED=$R2_CLOUDFLARE_VERSION"
      - name: Create GitHub R3 production deployment record
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'content-type: application/json' --data "$(jq -nc --arg ref "$GITHUB_SHA" '{ref:$ref,environment:"production",auto_merge:false,required_contexts:[],description:"ORDER011 R3 evidence truth audited Cloudflare deploy"}')" "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments")"
          id="$(printf '%s' "$deployment" | jq -r '.id')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'content-type: application/json' --data "$(jq -nc --arg url "$PRODUCTION_URL" '{state:"success",environment_url:$url,description:"ORDER011 R3 production verification passed",auto_inactive:true}')" "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments/$id/statuses" > artifacts/order011-r3/github-deployment-status.json
          printf '%s\n' "$deployment" > artifacts/order011-r3/github-deployment.json
          echo "GITHUB_DEPLOYMENT_ID=$id"
      - name: Upload complete R3 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order011-r3-terminal-${{ github.sha }}
          path: |
            artifacts/order011-r3
            playwright-report
            test-results
          if-no-files-found: error
          retention-days: 30
