name: Data Verify
on:
  push:
    paths:
      - 'data/**'
      - 'worker/horizons.js'
      - 'worker/dsn.js'
      - 'scripts/verify-data.mjs'
  pull_request:
    paths:
      - 'data/**'
      - 'worker/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npm run verify:data
      - run: node --test tests/worker.test.mjs tests/contracts.test.mjs
