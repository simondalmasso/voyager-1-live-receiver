name: ORDER010 SPICE Trajectory
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths: ['.github/workflows/order010-spice.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate trajectory from official NAIF SPKs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'spiceypy==7.0.0'
          mkdir -p /tmp/kernels artifacts/science-evidence worker
          base='https://naif.jpl.nasa.gov/pub/naif/VOYAGER/kernels/spk'
          curl -fsSL --proto '=https' --tlsv1.2 "$base/Voyager_1.a54206u_V0.2_merged.bsp" -o /tmp/kernels/vgr1-merged.bsp
          curl -fsSL --proto '=https' --tlsv1.2 "$base/vgr1.x2100.bsp" -o /tmp/kernels/vgr1.x2100.bsp
          curl -fsSL --proto '=https' --tlsv1.2 'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp' -o /tmp/kernels/de440s.bsp
          curl -fsSL --proto '=https' --tlsv1.2 'https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls' -o /tmp/kernels/naif0012.tls
          sha256sum /tmp/kernels/*
          python - <<'PY'
          import datetime as dt, hashlib, json, math, pathlib, urllib.parse, urllib.request
          import spiceypy as sp
          K=pathlib.Path('/tmp/kernels')
          merged=K/'vgr1-merged.bsp';extended=K/'vgr1.x2100.bsp'
          # Priority: merged mission reconstruction, modern planetary ephemeris, then long-range Voyager extension.
          for p in [K/'naif0012.tls',merged,K/'de440s.bsp',extended]: sp.furnsh(str(p))
          UTC=dt.timezone.utc
          def coverage(path):
              cell=sp.spkcov(str(path),-31);return [sp.wnfetd(cell,i) for i in range(sp.wncard(cell))]
          merged_cov=coverage(merged);extended_cov=coverage(extended);union=merged_cov+extended_cov
          def in_coverage(t):
              et=sp.str2et(t.strftime('%Y-%m-%dT%H:%M:%S'));return any(a+1<=et<=b-1 for a,b in union)
          def dates():
              out={dt.datetime(1977,9,5,14,0,tzinfo=UTC),dt.datetime(2026,8,7,8,0,tzinfo=UTC)}
              for y in range(1978,2027): out.add(dt.datetime(y,1,1,tzinfo=UTC))
              for center,days,step_h in [(dt.datetime(1979,3,5,tzinfo=UTC),20,6),(dt.datetime(1980,11,12,tzinfo=UTC),25,6),(dt.datetime(2004,12,16,tzinfo=UTC),10,24),(dt.datetime(2012,8,25,tzinfo=UTC),10,24)]:
                  h=-days*24
                  while h<=days*24: out.add(center+dt.timedelta(hours=h));h+=step_h
              cur=dt.datetime(2025,1,1,tzinfo=UTC)
              while cur<=dt.datetime(2026,8,7,tzinfo=UTC):
                  out.add(cur);cur=(cur.replace(day=28)+dt.timedelta(days=4)).replace(day=1)
              return [t for t in sorted(out) if in_coverage(t)]
          samples=[]
          for t in dates():
              et=sp.str2et(t.strftime('%Y-%m-%dT%H:%M:%S'));st,_=sp.spkezr('-31',et,'J2000','NONE','SUN')
              samples.append([t.isoformat().replace('+00:00','Z'),*map(lambda x:round(float(x),6),st[:3])])
          assert samples[0][0].startswith('1977-09-05') and len(samples)>400
          at=dt.datetime(2026,8,7,8,0,tzinfo=UTC);et=sp.str2et(at.strftime('%Y-%m-%dT%H:%M:%S'));earth_state,_=sp.spkezr('-31',et,'J2000','NONE','EARTH')
          q=urllib.parse.urlencode({'format':'text','COMMAND':"'-31'",'OBJ_DATA':'NO','MAKE_EPHEM':'YES','EPHEM_TYPE':'VECTORS','CENTER':"'500@399'",'START_TIME':"'2026-08-07 08:00:00'",'STOP_TIME':"'2026-08-07 08:01:00'",'STEP_SIZE':"'1 m'",'REF_SYSTEM':'ICRF','REF_PLANE':'FRAME','OUT_UNITS':'KM-S','VEC_LABELS':'NO','VEC_CORR':'NONE','CSV_FORMAT':'YES'})
          url='https://ssd.jpl.nasa.gov/api/horizons.api?'+q
          txt=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'voyager-link-order010'}),timeout=20).read().decode();block=txt.split('$$SOE',1)[1].split('$$EOE',1)[0]
          hv=None
          for line in block.splitlines():
              fields=[x.strip() for x in line.split(',')];vals=[]
              for x in fields:
                  try: vals.append(float(x))
                  except ValueError: vals.append(None)
              for i in range(2,max(2,len(vals)-5)):
                  c=vals[i:i+6]
                  if len(c)==6 and all(v is not None for v in c) and 1e8<math.hypot(*c[:3])<1e12 and math.hypot(*c[3:])<100: hv=c;break
              if hv: break
          assert hv,'Horizons vector parse failed'
          pos_err=math.sqrt(sum((earth_state[i]-hv[i])**2 for i in range(3)));vel_err=math.sqrt(sum((earth_state[i+3]-hv[i+3])**2 for i in range(3)))
          coverage_utc={'mergedStart':sp.et2utc(min(a for a,_ in merged_cov),'ISOC',3)+'Z','mergedEnd':sp.et2utc(max(b for _,b in merged_cov),'ISOC',3)+'Z','extendedStart':sp.et2utc(min(a for a,_ in extended_cov),'ISOC',3)+'Z','extendedEnd':sp.et2utc(max(b for _,b in extended_cov),'ISOC',3)+'Z'}
          evidence={'schemaVersion':1,'generatedAt':'2026-08-07T08:00:00Z','frame':'J2000/ICRF','target':'Voyager 1 (-31)','trajectoryCenter':'SUN','crosscheckCenter':'EARTH','kernelCoverageUtc':coverage_utc,'spiceKernels':['Voyager_1.a54206u_V0.2_merged.bsp','vgr1.x2100.bsp'],'sampleCount':len(samples),'adaptiveDensity':{'Jupiter':'6h ±20d','Saturn':'6h ±25d','terminationShock':'daily ±10d','heliopause':'daily ±10d','cruise':'annual','current':'monthly'},'horizonsCrosscheck':{'at':'2026-08-07T08:00:00Z','sourceUrl':url,'positionErrorKm':pos_err,'velocityErrorKmS':vel_err,'pass':pos_err<10000 and vel_err<0.05},'kernelSha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in K.iterdir()}}
          assert evidence['horizonsCrosscheck']['pass'],evidence['horizonsCrosscheck']
          traj={'schemaVersion':1,'frame':'J2000_ICRF_HELIOCENTRIC','units':{'position':'km'},'generatedAt':evidence['generatedAt'],'samples':samples,'provenance':{'truthClass':'DERIVED_GEOMETRY','sourceId':'naif-voyager-spice','sourceUrl':'https://naif.jpl.nasa.gov/pub/naif/VOYAGER/kernels/spk/','fetchedAt':evidence['generatedAt'],'transform':'NAIF Voyager merged mission SPK plus x2100 extension; adaptive mission-time sampling; current state cross-checked against JPL Horizons.'},'crosscheck':evidence['horizonsCrosscheck']}
          pathlib.Path('artifacts/science-evidence/spice-horizons-crosscheck.json').write_text(json.dumps(evidence,indent=2)+'\n');pathlib.Path('worker/trajectory.generated.js').write_text('export const SPICE_TRAJECTORY='+json.dumps(traj,separators=(',',':'))+';\n');print(json.dumps(evidence,indent=2));sp.kclear()
          PY
      - name: Commit generated scientific artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'order010-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add worker/trajectory.generated.js artifacts/science-evidence/spice-horizons-crosscheck.json
          git commit -m 'data(order010): regenerate full-mission SPICE trajectory'
          git pull --rebase origin feat/aud-001-complete-product
          git push origin HEAD:feat/aud-001-complete-product
