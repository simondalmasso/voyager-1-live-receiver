name: ORDER010 Cloudflare Auth Check
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths:
      - '.github/workflows/order010-auth-check.yml'
permissions:
  contents: read
jobs:
  cloudflare-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify credential presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" && echo 'CLOUDFLARE_API_TOKEN_PRESENT=yes' || { echo 'CLOUDFLARE_API_TOKEN_PRESENT=no'; exit 21; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && echo 'CLOUDFLARE_ACCOUNT_ID_PRESENT=yes' || { echo 'CLOUDFLARE_ACCOUNT_ID_PRESENT=no'; exit 22; }
      - name: Verify Cloudflare identity
        run: npx --yes wrangler@4.32.0 whoami
