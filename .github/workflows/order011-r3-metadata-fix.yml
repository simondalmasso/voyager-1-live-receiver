name: ORDER011 R3 Repository Metadata Fix
on:
  push:
    branches: [ops/order011-r3-metadata-fix]
    paths: ['ops/order011-r3-metadata-fix-trigger.json']
permissions:
  contents: read
env:
  TARGET_DESCRIPTION: Verified receive-only deep-space signal laboratory for Voyager 1 mission geometry, receiver DSP, provenance, and evidence truth.
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select existing administrative token without disclosure
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          alias=''
          for name in GH_ADMIN_TOKEN REPO_ADMIN_TOKEN GITHUB_PAT GH_PAT PERSONAL_ACCESS_TOKEN PAT_TOKEN ADMIN_TOKEN GH_TOKEN_SECRET; do
            value="${!name:-}"
            if test -n "$value"; then selected="$value"; alias="$name"; break; fi
          done
          if test -z "$selected"; then
            echo 'ADMIN_TOKEN_AVAILABLE=NO'
            exit 42
          fi
          echo "TOKEN_ALIAS=$alias"
          echo "token=$selected" >> "$GITHUB_OUTPUT"
        id: token
      - name: Patch repository About description
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg description "$TARGET_DESCRIPTION" '{description:$description}')"
          code="$(curl --silent --show-error -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'content-type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          echo "PATCH_HTTP_STATUS=$code"
          test "$code" = 200
          jq -e --arg description "$TARGET_DESCRIPTION" '.description==$description' /tmp/repo-patch.json >/dev/null
          echo 'REPOSITORY_DESCRIPTION_PATCH=PASS'
      - name: Independent readback
        shell: bash
        run: |
          set -euo pipefail
          repo="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          actual="$(printf '%s' "$repo" | jq -r '.description // ""')"
          test "$actual" = "$TARGET_DESCRIPTION"
          echo 'REPOSITORY_DESCRIPTION_READBACK=PASS'
