name: ORDER010 Payload Inspect
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths: ['.github/workflows/order010-payload-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged AUD002 payload
        shell: bash
        run: |
          set -euo pipefail
          cat aud002-payload.part00 aud002-payload.part01 | base64 -d > /tmp/aud002.gz
          echo "PAYLOAD_GZIP_SHA256=$(sha256sum /tmp/aud002.gz | awk '{print $1}')"
          gzip -t /tmp/aud002.gz
          gzip -dc /tmp/aud002.gz > /tmp/aud002.decoded
          echo "PAYLOAD_DECODED_SHA256=$(sha256sum /tmp/aud002.decoded | awk '{print $1}')"
          echo "PAYLOAD_TYPE=$(file -b /tmp/aud002.decoded)"
          echo '--- HEAD ---'
          head -n 40 /tmp/aud002.decoded
          echo '--- END HEAD ---'
