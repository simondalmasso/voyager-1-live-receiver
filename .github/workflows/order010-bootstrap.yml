name: ORDER010 Bootstrap Inspect
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths:
      - '.github/workflows/order010-bootstrap.yml'
permissions:
  contents: read
jobs:
  inspect-aud002-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged AUD-002 payload without applying it
        shell: bash
        run: |
          set -u
          cat aud002-payload.part00 aud002-payload.part01 | base64 -d > /tmp/aud002.gz
          echo "gzip_sha256=$(sha256sum /tmp/aud002.gz | awk '{print $1}')"
          if gzip -t /tmp/aud002.gz; then echo 'gzip_complete=yes'; else echo 'gzip_complete=no'; fi
          gzip -dc /tmp/aud002.gz > /tmp/aud002.payload 2>/tmp/gzip.err || true
          echo "payload_bytes=$(wc -c < /tmp/aud002.payload)"
          echo "payload_type=$(file -b /tmp/aud002.payload)"
          echo '--- gzip stderr ---'; cat /tmp/gzip.err || true
          echo '--- first 220 lines ---'
          head -220 /tmp/aud002.payload || true
          echo '--- last 80 lines ---'
          tail -80 /tmp/aud002.payload || true
          echo '--- tar listing if applicable ---'
          tar -tf /tmp/aud002.payload 2>/dev/null | head -200 || true
          exit 0
