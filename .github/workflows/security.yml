name: Security
on:
  push:
    branches: [main, feat/aud-001-complete-product, feat/order-011-deep-space-lab]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  secret-and-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret pattern scan
        run: |
          set -e
          ! grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='security.yml' --exclude='order011-ci.yml' --exclude='order010-deploy.yml' --exclude='order011-deploy.yml' --exclude='order013-final.yml' '(sk-[A-Za-z0-9_-]{20,}|CLOUDFLARE_API_TOKEN=.+|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .
      - name: Remote deploy invariant
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -RInE 'wrangler +deploy' .github/workflows | grep -v -- '--dry-run' || true)"
          test -z "$hits" && exit 0
          echo "$hits"
          unexpected="$(printf '%s\n' "$hits" | grep -vE '^\.github/workflows/(order010-deploy|order011-deploy|order013-final)\.yml:' || true)"
          test -z "$unexpected" || { echo "$unexpected"; echo 'Remote deploy command outside audited terminal workflows.' >&2; exit 1; }
          if grep -q '^\.github/workflows/order010-deploy\.yml:' <<<"$hits"; then
            grep -q 'AUD_COMMENT_ID: 5214873711' .github/workflows/order010-deploy.yml
            grep -q 'USD_BUDGET: "0"' .github/workflows/order010-deploy.yml
            grep -q 'PAYMENT_DATA: "NO"' .github/workflows/order010-deploy.yml
            grep -q 'RF_TX: "NO"' .github/workflows/order010-deploy.yml
            grep -q 'MAIN_MERGE: "NO"' .github/workflows/order010-deploy.yml
          fi
          if grep -q '^\.github/workflows/order011-deploy\.yml:' <<<"$hits"; then
            grep -q 'AUD_COMMENT_ID: 5217561657' .github/workflows/order011-deploy.yml
            grep -q 'USD_BUDGET: "0"' .github/workflows/order011-deploy.yml
            grep -q 'PAYMENT_DATA: "NO"' .github/workflows/order011-deploy.yml
            grep -q 'RF_TX: "NO"' .github/workflows/order011-deploy.yml
            grep -q 'MAIN_MERGE: "NO"' .github/workflows/order011-deploy.yml
          fi
          if grep -q '^\.github/workflows/order013-final\.yml:' <<<"$hits"; then
            grep -q 'AUD_COMMENT_ID: 5222234625' .github/workflows/order013-final.yml
            grep -q 'USD_BUDGET: "0"' .github/workflows/order013-final.yml
            grep -q 'PAYMENT_DATA: "NO"' .github/workflows/order013-final.yml
            grep -q 'RF_TX: "NO"' .github/workflows/order013-final.yml
            grep -q 'MAIN_MERGE: "NO"' .github/workflows/order013-final.yml
            grep -q 'R3_ROLLBACK_VERSION: e96f81ab-0c8a-4c19-b280-ee2af5c13468' .github/workflows/order013-final.yml
          fi
      - name: License inventory
        run: node scripts/inventory.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: artifacts/source-license-inventory.json
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
