name: ORDER010 Dependency Lock
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths: ['.github/workflows/order010-deps.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: 'npm'}
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Three.js
        run: node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/three'].version!=='0.180.0') process.exit(2); console.log(l.packages['node_modules/three'])"
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'order010-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(order010): lock Three.js 0.180.0'
          git push origin HEAD:feat/aud-001-complete-product
