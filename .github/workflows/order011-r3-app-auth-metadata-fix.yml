name: ORDER011 R3 App Auth Metadata Fix
on:
  push:
    branches: [ops/order011-r3-metadata-fix]
    paths: ['ops/order011-r3-app-auth-trigger.json']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TARGET_DESCRIPTION: Verified receive-only deep-space signal laboratory for Voyager 1 mission geometry, receiver DSP, provenance, and evidence truth.
      GITHUB_APP_ID_SECRET: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY_SECRET: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      GH_APP_ID_SECRET: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY_SECRET: ${{ secrets.GH_APP_PRIVATE_KEY }}
      APP_ID_SECRET: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY_SECRET: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Select existing GitHub App credential pair
        id: app
        shell: bash
        run: |
          set -euo pipefail
          pair=''; app_id=''; key=''
          if test -n "${GITHUB_APP_ID_SECRET:-}" && test -n "${GITHUB_APP_PRIVATE_KEY_SECRET:-}"; then pair=GITHUB_APP; app_id="$GITHUB_APP_ID_SECRET"; key="$GITHUB_APP_PRIVATE_KEY_SECRET";
          elif test -n "${GH_APP_ID_SECRET:-}" && test -n "${GH_APP_PRIVATE_KEY_SECRET:-}"; then pair=GH_APP; app_id="$GH_APP_ID_SECRET"; key="$GH_APP_PRIVATE_KEY_SECRET";
          elif test -n "${APP_ID_SECRET:-}" && test -n "${APP_PRIVATE_KEY_SECRET:-}"; then pair=APP; app_id="$APP_ID_SECRET"; key="$APP_PRIVATE_KEY_SECRET";
          else echo 'GITHUB_APP_ADMIN_CREDENTIAL_PAIR=NO'; exit 42; fi
          printf '%s' "$key" > /tmp/github-app-key.pem
          chmod 600 /tmp/github-app-key.pem
          echo "APP_PAIR_ALIAS=$pair"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
      - name: Mint installation token and patch About
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/app.jwt
          const fs=require('fs'), crypto=require('crypto');
          const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const input=b64({alg:'RS256',typ:'JWT'})+'.'+b64({iat:now-60,exp:now+540,iss:process.env.APP_ID});
          const sig=crypto.sign('RSA-SHA256',Buffer.from(input),fs.readFileSync('/tmp/github-app-key.pem')).toString('base64url');
          process.stdout.write(input+'.'+sig);
          NODE
          jwt="$(cat /tmp/app.jwt)"
          install_code="$(curl --silent --show-error -o /tmp/install.json -w '%{http_code}' -H "Authorization: Bearer $jwt" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/installation")"
          echo "INSTALLATION_LOOKUP_HTTP_STATUS=$install_code"
          test "$install_code" = 200
          installation_id="$(jq -r '.id' /tmp/install.json)"
          repo_name="${GITHUB_REPOSITORY#*/}"
          token_code="$(curl --silent --show-error -o /tmp/token.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'content-type: application/json' --data "$(jq -nc --arg repo "$repo_name" '{repositories:[$repo],permissions:{administration:"write",metadata:"read"}}')" "https://api.github.com/app/installations/$installation_id/access_tokens")"
          echo "INSTALLATION_TOKEN_HTTP_STATUS=$token_code"
          test "$token_code" = 201
          token="$(jq -r '.token' /tmp/token.json)"
          payload="$(jq -nc --arg description "$TARGET_DESCRIPTION" '{description:$description}')"
          patch_code="$(curl --silent --show-error -o /tmp/repo-patch.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $token" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H 'content-type: application/json' --data "$payload" "https://api.github.com/repos/$GITHUB_REPOSITORY")"
          echo "PATCH_HTTP_STATUS=$patch_code"
          test "$patch_code" = 200
          jq -e --arg description "$TARGET_DESCRIPTION" '.description==$description' /tmp/repo-patch.json >/dev/null
          echo 'REPOSITORY_DESCRIPTION_PATCH=PASS'
      - name: Public readback
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY" | jq -r '.description // ""')"
          test "$actual" = "$TARGET_DESCRIPTION"
          echo 'REPOSITORY_DESCRIPTION_READBACK=PASS'
