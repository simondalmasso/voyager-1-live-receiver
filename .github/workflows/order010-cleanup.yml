name: ORDER010 Restore Stable Head After External Blocker
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths:
      - '.github/workflows/order010-cleanup.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pre-recovery product state and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'order010-arq'
          git config user.email 'actions@users.noreply.github.com'
          git revert --no-edit ae70f87c14ed250be532d9c7c97e3d560460fb25
          rm -f .github/workflows/order010-bootstrap.yml .github/workflows/order010-auth-check.yml .github/workflows/order010-cleanup.yml
          git add -A
          git commit -m 'chore(order010): remove temporary execution workflows'
          git push origin HEAD:feat/aud-001-complete-product
