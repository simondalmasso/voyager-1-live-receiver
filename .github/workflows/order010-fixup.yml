name: ORDER010 Deterministic Fixup
on:
  push:
    branches: [feat/aud-001-complete-product]
    paths: ['.github/workflows/order010-fixup.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Correct source typo and syntax-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app.js');s=p.read_text();s=s.replace('(r?.04:0)','(r?0.04:0)');p.write_text(s)
          PY
          node --check src/app.js
          node --check src/signal.js
          node --check src/scene.js
          node --check worker/index.js
          node --check shared/contracts.js
      - name: Commit if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'order010-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(order010): correct Signal Hunt scoring syntax'
          git push origin HEAD:feat/aud-001-complete-product
